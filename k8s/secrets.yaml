# ⚠  Do NOT commit real secrets.
# Use `kubectl create secret generic nexus-secrets --from-env-file=.env -n nexus`
# or a secret manager (Vault, AWS Secrets Manager, Sealed Secrets).
#
# This manifest shows the required keys — values are base64-encoded placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: nexus-secrets
  namespace: nexus
type: Opaque
stringData:
  APP_SECRET_KEY: "CHANGE_ME_32_CHARS_MIN"
  DATABASE_URL: "postgresql+asyncpg://nexus:nexus@postgres:5432/nexus"
  REDIS_URL: "redis://redis:6379/0"
  REDIS_CACHE_URL: "redis://redis:6379/1"
  QDRANT_URL: "http://qdrant:6333"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "CHANGE_ME"
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  SMTP_PASSWORD: ""
  GOOGLE_CLIENT_SECRET: ""
  MICROSOFT_CLIENT_SECRET: ""
