---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-celery
  namespace: nexus
  labels:
    app: nexus-celery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-celery
  template:
    metadata:
      labels:
        app: nexus-celery
    spec:
      containers:
        - name: celery
          image: nexus-backend:latest
          command: ["celery", "-A", "src.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: nexus-config
            - secretRef:
                name: nexus-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexus-celery-hpa
  namespace: nexus
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexus-celery
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
