apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  namespace: nexus
data:
  APP_ENV: "production"
  APP_VERSION: "1.0.0"
  LLM_PROVIDER: "ollama"
  LLM_MODEL: "gemma3:4b"
  OLLAMA_BASE_URL: "http://ollama:11434"
  EMBEDDING_PROVIDER: "ollama"
  EMBEDDING_MODEL: "nomic-embed-text"
  EMBEDDING_DIMENSIONS: "768"
  VECTOR_STORE_TYPE: "qdrant"
  HYBRID_SEARCH_ENABLED: "true"
  RERANKER_TYPE: "local"
  STORAGE_BACKEND: "minio"
  MINIO_ENDPOINT: "minio:9000"
  MINIO_BUCKET: "nexus-documents"
  MINIO_SECURE: "false"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "nexus-backend"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  CORS_ORIGINS: '["https://nexus.example.com"]'
  APP_URL: "https://nexus.example.com"
  INVITE_ONLY: "true"
