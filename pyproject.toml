[project]
name = "rag-build"
version = "0.1.0"
description = "Enterprise RAG system with RBAC, compliance scanning, and multi-format ingestion"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1.0",

    # Settings
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Vector store
    "chromadb>=0.4.22",
    "qdrant-client>=1.8.0",

    # Hybrid search
    "rank-bm25>=0.2.2",

    # LLM / Embedding
    "httpx>=0.26.0",

    # Document parsing
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pandas>=2.1.0",
    "python-multipart>=0.0.6",
    "python-pptx>=0.6.23",
    "lxml>=5.1.0",
    "beautifulsoup4>=4.12.0",

    # Utilities
    "python-magic>=0.4.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
